version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /tooling/python
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns: ["*"]
