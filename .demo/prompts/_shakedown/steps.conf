# id | prompt file | timeout (min) | verify command (run with cwd = projects/<PROJECT>)
#
# A step is complete only when BOTH are true:
#   - the worker wrote .progress/steps/<id>.done   (it says it finished)
#   - the verify command exits 0                   (the artifacts agree)
#
# Verify checks content, not just existence: v1 accepted any file at the right
# path, which would have passed an empty placeholder.

01|01-protocol.md|70|test -s 01_protocol/pico.yaml && test -s 01_protocol/eligibility.md && grep -q 'preliminary' 01_protocol/pico.yaml
02|02-search.md|80|test -s 02_search/round-01/dedupe.bib && grep -qc '@' 02_search/round-01/dedupe.bib
02b|02b-search-round02.md|80|test -s 02_search/round-02/dedupe.bib && test -s 02_search/round-01/dedupe.bib
02c|02c-terms-round03.md|45|test -s 03_screening/screening-database.csv && [ "$(wc -l < 03_screening/screening-database.csv)" -ge 100 ] && test -s 02_search/round-03/dedupe.bib
03|03-screening.md|45|test -s 03_screening/round-01/included.bib && test -s 03_screening/round-01/agreement.md && grep -qiE 'kappa' 03_screening/round-01/agreement.md && grep -qiE 'confirmed *: *"?(nma|pairwise|pooled_proportion|narrative)' 01_protocol/pico.yaml
04|04-fulltext.md|95|test -s 04_fulltext/fulltext_decisions.csv && test -s 04_fulltext/ft_agreement.md && grep -qi 'FT_Final_Decision' 04_fulltext/fulltext_decisions.csv
05|05-extraction.md|95|test -s 05_extraction/extraction.csv && test -s 05_extraction/data-dictionary.md && [ "$(wc -l < 05_extraction/extraction.csv)" -ge 3 ]
06|06-nma.md|130|test -d 06_analysis/tables && [ "$(find 06_analysis/tables -name '*.csv' | wc -l)" -ge 2 ] && [ "$(find 06_analysis/figures -name '*.png' | wc -l)" -ge 4 ]
07|07-figures.md|80|[ "$(find 06_analysis/figures/presentation -name '*.png' 2>/dev/null | wc -l)" -ge 5 ]
08|08-manuscript.md|110|test -s 07_manuscript/index.html && [ "$(find 07_manuscript -name '*.qmd' | wc -l)" -ge 1 ]
09|09-review-qa.md|95|test -s 08_reviews/grade_summary.csv && test -s 09_qa/pipeline-checklist.md
10|10-submission-demo.md|80|test -s DEMO_WALKTHROUGH.md && test -s README.md
